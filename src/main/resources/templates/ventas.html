<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Historial de Ventas</title>
    <!-- CSS de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Historial de Ventas</h2>
        <div>
            <a th:href="@{/ventas/nueva}" class="btn btn-primary">+ Nueva Venta</a>
            <a th:href="@{/productos}" class="btn btn-outline-secondary ms-2">Ir a Productos</a>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover table-striped mb-0">
                <thead class="table-dark">
                <tr>
                    <th># ID</th>
                    <th>Fecha y Hora</th>
                    <th>Cant. Ítems</th>
                    <th>Total</th>
                </tr>
                </thead>
                <tbody>
                <!-- Si no hay ventas todavía -->
                <tr th:if="${#lists.isEmpty(ventas)}">
                    <td colspan="4" class="text-center py-4 text-muted">
                        No hay ventas registradas aún.
                    </td>
                </tr>

                <!-- Recorremos la lista de ventas -->
                <tr th:each="v : ${ventas}">
                    <td th:text="${v.idVenta}" class="fw-bold">1</td>
                    <td th:text="${#temporals.format(v.fechaHora, 'dd/MM/yyyy HH:mm')}">18/08/2026 10:30</td>
                    <td th:text="${#lists.size(v.detalles)}">1</td>
                    <td th:text="${'$' + v.total}" class="text-success fw-bold">$1000.00</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
