<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrar Venta</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Registrar Nueva Venta</h4>
                </div>
                <div class="card-body">

                    <!-- Formulario vinculado al objeto 'venta' del controlador -->
                    <form th:action="@{/ventas/guardar}" th:object="${venta}" method="post">

                        <!-- Selección de Producto -->
                        <div class="mb-3">
                            <label for="producto" class="form-label">Producto</label>
                            <select id="producto" class="form-select" th:field="*{detalles[0].producto.idProducto}" required>
                                <option value="">-- Seleccione un producto --</option>
                                <option th:each="p : ${productos}"
                                        th:value="${p.idProducto}"
                                        th:text="${p.nombre + ' - $' + p.precio + ' (Stock: ' + p.stock + ')'}">
                                </option>
                            </select>
                        </div>

                        <!-- Cantidad -->
                        <div class="mb-3">
                            <label for="cantidad" class="form-label">Cantidad</label>
                            <input type="number" id="cantidad" class="form-control" th:field="*{detalles[0].cantidad}" min="1" value="1" required>
                        </div>

                        <!-- Botones -->
                        <div class="d-flex justify-content-between">
                            <a th:href="@{/productos}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-success">Confirmar Venta</button>
                        </div>

                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
